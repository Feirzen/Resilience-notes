<body>
<header class="top" id="top"></header>
<main id="main"><p style="padding:40px;text-align:center;color:#7a705c">Loading Resilience Notes…</p></main>
<script>
// If anything fails to load, show the reason on the page instead of a blank screen.
window.addEventListener("error", e => { const m = document.getElementById("main"); if (m && !window.__rnStarted) m.innerHTML = '<div style="max-width:520px;margin:40px auto;padding:16px;border-radius:12px;background:#fdecec;color:#b8282d;font:14px system-ui">The app hit a problem while loading:<br><b>' + (e.message || (e.target && e.target.src) || "unknown") + '</b><br>Send Claude a screenshot of this.</div>'; }, true);
setTimeout(() => { if (!window.__rnStarted) { const m = document.getElementById("main"); if (m && m.textContent.includes("Loading")) m.innerHTML = '<p style="padding:40px;text-align:center;color:#b8282d;font:14px system-ui">Still loading after 15 seconds. Try refreshing. If it stays blank, send Claude a screenshot.</p>'; } }, 15000);
</script>
